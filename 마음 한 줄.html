<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>마음 한 줄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout: 손그림 시안 그대로 — 가운데 정렬된 폰 크기 한 열. 제목·질문, 같은 크기 박스 6개(항상 2열, 왼쪽 이모티콘 + 두 줄 글자), 안내 문구, 명언 카드. */
:root {
  --bg: #e9eeee; --surface: #f6f8f8; --fg: #243238; --muted: #5d6e74; --line: #cbd6d7; --ink-on-fill: #1d282c;
  --joy: #d4b06a; --joy-tint: #f2ead6;
  --sad: #86a3ba; --sad-tint: #dfe9f1;
  --tired: #93ad94; --tired-tint: #e1ede2;
  --anx: #a69fbd; --anx-tint: #e8e5f0;
  --exc: #dca5b2; --exc-tint: #f5e4e8;
  --ang: #c89279; --ang-tint: #f3e3dc;
  --mood: var(--line); --mood-tint: var(--surface);
  --display: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
  --body: "Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161d21; --surface: #1f282d; --fg: #e5ebec; --muted: #9fb0b5; --line: #34444a;
    --joy-tint: #3a3526; --sad-tint: #26333f; --tired-tint: #27362a; --anx-tint: #322f40; --exc-tint: #3d2c32; --ang-tint: #3b2d27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161d21; --surface: #1f282d; --fg: #e5ebec; --muted: #9fb0b5; --line: #34444a;
  --joy-tint: #3a3526; --sad-tint: #26333f; --tired-tint: #27362a; --anx-tint: #322f40; --exc-tint: #3d2c32; --ang-tint: #3b2d27;
  color-scheme: dark;
}
* { box-sizing: border-box; }
.tag, .note, .guide { word-break: keep-all; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 18px; line-height: 1.6;
  padding: 24px 16px 40px;
}
.app {
  max-width: 460px; margin-inline: auto;
  display: flex; flex-direction: column; gap: 22px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 36px;
  padding: 32px 16px 26px;
}
header { text-align: center; display: flex; flex-direction: column; gap: 6px; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 1.6rem + 2vw, 2.5rem); letter-spacing: 0.04em; }
.ask { margin: 0; font-size: 1.35rem; color: var(--muted); }

.moods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mood-btn {
  --c: var(--line);
  appearance: none; font: inherit;
  display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 6px;
  height: 108px; width: 100%;
  padding: 8px 6px;
  border: 3px solid var(--c); border-radius: 20px;
  background: var(--bg); color: var(--fg);
  cursor: pointer; text-align: left;
  transition: background-color .25s, transform .15s;
}
.emo { flex: none; width: auto; text-align: center; font-size: 2.1rem; line-height: 1;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.lbl { display: flex; flex-direction: column; font-size: 1.4rem; line-height: 1.3; word-break: keep-all; min-width: 0; }
.lbl span { white-space: nowrap; }
.mood-btn:hover { transform: translateY(-2px); }
.mood-btn:active { transform: translateY(0); }
.mood-btn[aria-pressed="true"] { background: var(--c); color: var(--ink-on-fill); }
.mood-btn:focus-visible, .act:focus-visible { outline: 4px solid var(--fg); outline-offset: 3px; }
@media (max-width: 420px) { .app { padding-inline: 10px; } .moods { gap: 10px; } }
@media (max-width: 350px) { .lbl { font-size: 1.15rem; } .emo { font-size: 1.7rem; } .mood-btn { gap: 4px; padding-inline: 4px; } }
.m-joy { --c: var(--joy); } .m-exc { --c: var(--exc); } .m-sad { --c: var(--sad); }
.m-tired { --c: var(--tired); } .m-anx { --c: var(--anx); } .m-ang { --c: var(--ang); }

#app[data-mood="joy"] { --mood: var(--joy); --mood-tint: var(--joy-tint); }
#app[data-mood="sad"] { --mood: var(--sad); --mood-tint: var(--sad-tint); }
#app[data-mood="tired"] { --mood: var(--tired); --mood-tint: var(--tired-tint); }
#app[data-mood="anx"] { --mood: var(--anx); --mood-tint: var(--anx-tint); }
#app[data-mood="exc"] { --mood: var(--exc); --mood-tint: var(--exc-tint); }
#app[data-mood="ang"] { --mood: var(--ang); --mood-tint: var(--ang-tint); }

.guide { margin: 4px 0 0; font-size: 1.25rem; line-height: 1.55; }
.card {
  background: var(--mood-tint);
  border: 3px solid var(--mood); border-radius: 26px;
  padding: 24px 22px; min-height: 180px;
  display: flex; flex-direction: column; gap: 18px;
  transition: background-color .35s, border-color .35s;
}
.tag { margin: 0; font-size: 1rem; color: var(--muted); }
blockquote { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.quote { margin: 0; font-family: var(--display); font-size: clamp(1.4rem, 1.2rem + 1vw, 1.7rem); line-height: 1.7;
  word-break: keep-all; text-wrap: pretty; overflow-wrap: anywhere; }
.author { margin: 0; font-family: var(--display); font-size: 1.1rem; color: var(--muted); }
.swap { animation: rise .45s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .swap { animation: none; } .mood-btn { transition: none; } }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.act { appearance: none; font: inherit; font-size: 1.1rem; cursor: pointer;
  min-height: 52px; padding: 10px 20px; border-radius: 16px;
  border: 3px solid var(--fg); background: transparent; color: var(--fg); }
.act.primary { background: var(--fg); color: var(--bg); }
.act:hover { opacity: .88; }
.act[hidden], .tag[hidden] { display: none; }
.note { margin: 0; font-size: .9rem; color: var(--muted); }
</style>

<div class="app" id="app" data-mood="">
  <header>
    <h1>마음 한 줄</h1>
    <p class="ask">오늘은 어떤 마음이었나요?</p>
  </header>

  <div class="moods" role="group" aria-label="오늘 느낀 감정">
    <button class="mood-btn m-joy" data-k="joy" aria-pressed="false" type="button"><span class="emo" aria-hidden="true">😊</span><span class="lbl"><span>기쁘고</span><span>행복함</span></span></button>
    <button class="mood-btn m-exc" data-k="exc" aria-pressed="false" type="button"><span class="emo" aria-hidden="true">🥰</span><span class="lbl"><span>설레고</span><span>기대됨</span></span></button>
    <button class="mood-btn m-sad" data-k="sad" aria-pressed="false" type="button"><span class="emo" aria-hidden="true">😢</span><span class="lbl"><span>슬프고</span><span>우울함</span></span></button>
    <button class="mood-btn m-tired" data-k="tired" aria-pressed="false" type="button"><span class="emo" aria-hidden="true">😪</span><span class="lbl"><span>지치고</span><span>번아웃</span></span></button>
    <button class="mood-btn m-anx" data-k="anx" aria-pressed="false" type="button"><span class="emo" aria-hidden="true">😰</span><span class="lbl"><span>불안하고</span><span>스트레스</span></span></button>
    <button class="mood-btn m-ang" data-k="ang" aria-pressed="false" type="button"><span class="emo" aria-hidden="true">😠</span><span class="lbl"><span>화나고</span><span>두근거림</span></span></button>
  </div>

  <p class="guide">감정 버튼을 눌러 보세요.<br>마음 한 줄이 기다리고 있어요.</p>

  <section class="card" aria-live="polite">
    <p class="tag" id="tag" hidden></p>
    <blockquote id="bq">
      <p class="quote" id="q"></p>
      <p class="author" id="a"></p>
    </blockquote>
    <div class="actions">
      <button class="act primary" id="more" type="button" hidden>다른 명언 보기</button>
      <button class="act" id="copy" type="button" hidden>복사하기</button>
    </div>
  </section>

  <p class="note">'전해지는 말'은 출처가 정확히 확인되지 않은 경우이고, 번역은 뜻을 살린 의역일 수 있어요.</p>
</div>

var appEl = document.getElementById("app");
var qEl = document.getElementById("q"), aEl = document.getElementById("a"), tagEl = document.getElementById("tag");
var bq = document.getElementById("bq");
var moreBtn = document.getElementById("more"), copyBtn = document.getElementById("copy");
var btns = Array.prototype.slice.call(document.querySelectorAll(".mood-btn"));
var current = null, bag = {}, last = {};

function nextIndex(k) {
  var n = Q[k].list.length;
  if (!bag[k] || bag[k].length === 0) {
    var arr = [];
    for (var i = 0; i < n; i++) arr.push(i);
    for (var j = n - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)); var t = arr[j]; arr[j] = arr[r]; arr[r] = t; }
    if (arr[arr.length - 1] === last[k]) { var s = arr.pop(); arr.unshift(s); }
    bag[k] = arr;
  }
  var idx = bag[k].pop();
  last[k] = idx;
  return idx;
}

function show(k) {
  var item = Q[k].list[nextIndex(k)];
  qEl.textContent = item[0];
  aEl.textContent = "— " + item[1] + (item[2] ? " (전해지는 말)" : "");
  tagEl.hidden = false;
  tagEl.textContent = Q[k].name + " · 명언 " + Q[k].list.length + "개 중 하나";
  bq.classList.remove("swap");
  void bq.offsetWidth;
  bq.classList.add("swap");
}

btns.forEach(function (b) {
  b.addEventListener("click", function () {
    var k = b.getAttribute("data-k");
    current = k;
    appEl.setAttribute("data-mood", k);
    btns.forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    moreBtn.hidden = false; copyBtn.hidden = false;
    copyBtn.textContent = "복사하기";
    show(k);
  });
});
moreBtn.addEventListener("click", function () { if (current) { copyBtn.textContent = "복사하기"; show(current); } });
copyBtn.addEventListener("click", function () {
  var text = qEl.textContent + " " + aEl.textContent;
  function done(ok) { copyBtn.textContent = ok ? "복사했어요" : "길게 눌러 직접 복사해 주세요"; }
  try {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { sel(); });
  } catch (e) { sel(); }
  function sel() {
    try {
      var r = document.createRange(); r.selectNodeContents(bq);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) {}
    done(false);
  }
});
